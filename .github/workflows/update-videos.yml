name: Update videos

# Fetches the YouTube feed into videos.json and redeploys the site.
# Commits made with GITHUB_TOKEN don't trigger the main deploy workflow,
# so this workflow deploys itself: on a schedule only when the list changes,
# and always when run by hand or by a push.
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-videos.yml
      - .github/scripts/update_videos.py

permissions:
  contents: write

# Shared with the main deploy workflow so two production deploys never
# overlap (Azure cancels the older one when they do).
concurrency:
  group: swa-production
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch feed
        run: python .github/scripts/update_videos.py
      - name: Commit if changed
        id: commit
        run: |
          git add videos.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update videos.json from YouTube feed"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_SAND_0B9CD0210 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: ""
          output_location: "."
